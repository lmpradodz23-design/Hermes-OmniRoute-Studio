# Configuração do gitleaks — o portão de segredos do repositório.
#
# ── Por que este arquivo existe ─────────────────────────────────────────────
#
# Sem allowlist a varredura devolve 1478 achados neste repositório, e por isso
# não é um portão: ninguém lê 1478 linhas, e um segredo de verdade some no meio.
# Cada exceção abaixo foi conferida à mão contra o conteúdo real do arquivo.
#
# Triagem completa do histórico (22 commits, 251 MB, 2026-08-22):
#
#   1478 achados brutos
#   1475 de commits do UPSTREAM (fangliquan, Teknium)
#      3 de um commit do fork — URL pública de badge do star-history.com
#        dentro do README de uma skill de terceiro
#      0 credenciais reais
#
# ── A regra ao mexer aqui ───────────────────────────────────────────────────
#
# Exceção é por REGRA + CAMINHO, nunca por caminho inteiro. Silenciar `tests/**`
# por completo é exatamente como um segredo de verdade entra: como fixture.
# Abaixo, `tests/**` só é dispensado da regra genérica de entropia; um PAT do
# GitHub, uma chave AWS ou um bloco de chave privada num teste continua
# quebrando o build.

title = "Hermes OmniRoute Studio"

[extend]
useDefault = true

# ─────────────────────────────────────────────────────────────────────────────
# 1. O redator e os fixtures dele — vale para TODAS as regras
# ─────────────────────────────────────────────────────────────────────────────
# `agent/redact.py` contém os PADRÕES que apagam segredos, inclusive
# `-----BEGIN PRIVATE KEY-----`, que o gitleaks lê como uma chave de verdade.
# `tests/agent/test_redact.py` constrói tokens sintéticos e verifica que saem
# redigidos. Sem esta exceção o portão acusa a própria defesa.
[[allowlists]]
description = "Redator de segredos e seus fixtures"
paths = [
  '''^agent/redact\.py$''',
  '''^tests/agent/test_redact\.py$''',
]

# ─────────────────────────────────────────────────────────────────────────────
# 2. Conteúdo de terceiro que não é nosso para editar
# ─────────────────────────────────────────────────────────────────────────────
[[allowlists]]
description = "Docs raspadas do Unsloth e código vendorizado"
paths = [
  '''^optional-skills/mlops/training/unsloth/references/llms-(full|txt)\.md$''',
  '''(^|/)vendor/''',
]

# ─────────────────────────────────────────────────────────────────────────────
# 3. Identificadores públicos por definição
# ─────────────────────────────────────────────────────────────────────────────
# CLIENT ID de OAuth aparece na URL de redirecionamento de qualquer fluxo OAuth
# — é público, não é credencial. Conferidos um a um: Anthropic, MiniMax, xAI,
# Qwen, GitHub Copilot. Idem IDs de catálogo (voz do ElevenLabs) e a URL de
# badge do star-history.
[[allowlists]]
description = "IDs públicos: OAuth client id, catálogo de voz, badge"
regexTarget = "line"
regexes = [
  '''_OAUTH_CLIENT_ID\s*=\s*["'][A-Za-z0-9._-]{8,64}["']''',
  '''_VOICE_ID\s*=\s*["'][A-Za-z0-9]{16,32}["']''',
  '''api\.star-history\.com/chart\?''',
]


# ─────────────────────────────────────────────────────────────────────────────
# 4. `generic-api-key` redefinida localmente
# ─────────────────────────────────────────────────────────────────────────────
# Por que redefinir em vez de silenciar por caminho: no gitleaks, `targetRules`
# NÃO se aplica a regras herdadas de `[extend] useDefault`. Medido aqui: uma
# allowlist com `targetRules = ["generic-api-key"]` sobre `^tests/` não filtra
# nada, enquanto a mesma allowlist SEM `targetRules` remove o arquivo inteiro de
# TODAS as regras — inclusive `github-pat`, que é justamente a que precisa
# continuar valendo dentro de `tests/`, porque um segredo real entra disfarçado
# de fixture.
#
# Declarar a regra aqui com o mesmo id substitui a padrão, e aí a allowlist
# aninhada funciona. Resultado: em `tests/` e na documentação cai APENAS a
# heurística de entropia; as outras regras específicas (github-pat,
# aws-access-token, stripe, slack, private-key, openai…) seguem ativas na
# árvore inteira.
#
# A regex segue a regra padrão do gitleaks. A entropia sobe de 3.5 para 3.7:
# medido neste repositório, 3.5 acusa hash de lockfile e id de teste sem
# acrescentar nenhuma detecção real.
[[rules]]
id = "generic-api-key"
description = "Chave ou segredo generico identificado por palavra-chave e entropia"
regex = '''(?i)[\w.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passwd|password|secret|token)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([\w.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:[\x60'"\s;]|\\[nr]|$)'''
secretGroup = 1
entropy = 3.7
keywords = ["access","auth","api","credential","creds","key","passwd","password","secret","token"]

  [[rules.allowlists]]
  description = "Fixtures de teste e placeholders de documentacao"
  paths = [
    '''^tests/''',
    '''^website/''',
    '''^docs/''',
    '''\.test\.(ts|tsx|js|mjs|cjs)$''',
    '''(^|/)test_[^/]+\.py$''',
    '''_test\.py$''',
    '''(^|/)(README|SKILL|CHANGELOG)\.md$''',
    '''(^|/)__tests__/''',
    '''(^|/)e2e/''',
  ]

  [[rules.allowlists]]
  description = "IDs publicos e marcadores sinteticos de teste"
  regexTarget = "line"
  regexes = [
    '''_OAUTH_CLIENT_ID\s*=\s*["'][A-Za-z0-9._-]{8,64}["']''',
    '''_VOICE_ID\s*=\s*["'][A-Za-z0-9]{16,32}["']''',
    # scripts/toolperf_abeval/ab_eval.py: marcador sintetico que o proprio
    # script imprime para verificar que um token no MEIO da saida e encontrado.
    # O valor esta escrito no fonte e nao autentica nada.
    '''UNIQUE_TOKEN=tok_[a-z0-9_]+''',
  ]

# ─────────────────────────────────────────────────────────────────────────────
# 5. Exemplos de documentacao HTTP
# ─────────────────────────────────────────────────────────────────────────────
# `curl -H "Authorization: Bearer <token>"` e como se documenta uma API HTTP.
# `DISCORD_ALLOWED_USERS=` e `MATTERMOST_ALLOWED_USERS=` sao listas de ID de
# usuario; o gitleaks casa o formato snowflake e chama de token.
# Estas tres regras sao redefinidas localmente pelo mesmo motivo do bloco 4.
[[rules]]
id = "curl-auth-header"
description = "Cabecalho de autorizacao em linha de comando curl"
regex = '''\bcurl\b(?:.*?|\s)(?:-H|--header)(?:=|\s)(?:"|')?(?i)(?:Authorization:\s*)(?:Bearer|token|Basic)\s+([\w\-.=~+/]{15,200})(?:"|')?'''
secretGroup = 1
keywords = ["curl"]

  [[rules.allowlists]]
  description = "Exemplos de documentacao"
  paths = ['''^website/''', '''^docs/''', '''^tests/''', '''(^|/)test_[^/]+\.py$''']

[[rules]]
id = "discord-client-id"
description = "Discord client id"
regex = '''(?i)\b(?:discord)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9]{17,20})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
secretGroup = 1
keywords = ["discord"]

  [[rules.allowlists]]
  description = "Listas de ID de usuario na documentacao"
  paths = ['''^website/''', '''^docs/''', '''^tests/''', '''(^|/)test_[^/]+\.py$''']

[[rules]]
id = "mattermost-access-token"
description = "Mattermost access token"
regex = '''(?i)\b(?:mattermost)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)(?:'|\"|\s|=|\x60){0,5}([a-z0-9]{26})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
secretGroup = 1
keywords = ["mattermost"]

  [[rules.allowlists]]
  description = "Listas de ID de usuario na documentacao"
  paths = ['''^website/''', '''^docs/''', '''^tests/''', '''(^|/)test_[^/]+\.py$''']
