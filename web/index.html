<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Hermes Agent - Dashboard</title>

    <!-- PWA. O service worker e a politica de cache dele estao em
         public/sw.js e public/sw-policy.js; leia o cabecalho do segundo antes
         de mexer, porque este index.html recebe um token de sessao de uso
         unico injetado pelo servidor Python e por isso NUNCA pode ser
         precacheado. -->
    <!-- Relativos: sob um prefixo de proxy (/hermes/) os absolutos dão 404,
         o Chrome não oferece "Instalar app" e o atalho do iOS fica genérico. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark light" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hermes" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
