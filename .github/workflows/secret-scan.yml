name: secret-scan

# Portão de segredos. Roda no histórico completo, não só no diff: uma credencial
# removida no commit seguinte continua clonável por qualquer pessoa depois que o
# repositório for público, e é justamente esse caso que um scan de diff não vê.
#
# A configuração vive em `.gitleaks.toml`, e o cabeçalho dela explica cada
# exceção — todas conferidas à mão contra o conteúdo real do arquivo.
#
# Este job NÃO usa segredo nenhum, de propósito: precisa rodar em pull request
# de contribuidor externo, que é exatamente quando um segredo colado por engano
# tem mais chance de aparecer.

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Uma varredura semanal pega regra nova do gitleaks contra histórico antigo.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (histórico completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` não é opcional aqui. Com o padrão (1) o gitleaks
          # varre um único commit e passa verde sobre um histórico envenenado.
          fetch-depth: 0

      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Varrer o histórico completo
        run: |
          set -euo pipefail
          /tmp/gitleaks git \
            --log-opts="--all" \
            --config=.gitleaks.toml \
            --report-format=sarif \
            --report-path=gitleaks.sarif \
            --redact \
            --no-banner

      - name: Anexar o relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30
